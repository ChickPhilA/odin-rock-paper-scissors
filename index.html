<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors by Phillipe Manio </title>
    <link rel="stylesheet" href="style.css"> <!-- This is where our .css file will be linked -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double+Ink:wght@100..900&family=Poetsen+One&family=Viga&display=swap');
    </style>
</head>
<body>
    <div class="title">
        <div> Rock, Paper, Scissors </div>
        <div> Phillipe Manio <span style="font-size: 15px; color: goldenrod;">x</span> The Odin Project </div>
    </div>

    <div id="round-number"> 
        Round 0/10
    </div> <!-- a div will be added here displaying the round number-->

    <div class="game"> <!-- a container for the rock paper scissors game-->
        <!-- a div will be added here displaying "You chose: (choice)"-->
        <div id="round"></div>
        <div class="game-buttons">
            <button id="rock" class="btn"> Rock 🪨 </button>
            <button id="paper" class="btn"> Paper 📄 </button>
            <button id="scissors" class="btn"> Scissors ✂️ </button>
        </div>
    </div>

    <div class="score"> <!-- a container for the results of the game-->
        <div id="id-score"> Player Score: </div>
        <div id="computer-score"> Computer Score: </div>
        <div id="tie-score"> Ties: </div>
    </div>

    <div class="selection">
        <div id="you-chose"> </div> <!-- a div will be added here displaying "You chose: (choice)"-->
        <div id="computer-chose"> </div> <!-- a div will be added here displaying "The computer chose: (choice)"-->
    </div>

    <div id="final-result">
        <!-- a div will be added here displaying the final result of the game-->
    </div>

    <script src="game.js"> </script>
</body>
</html>
